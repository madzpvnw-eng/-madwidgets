<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Word Counter — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="counter-container">
        <div class="counter-card">
            <div class="counter-head">
                <div>
                    <h1 class="counter-title">Word & Text Counter</h1>
                    <span class="counter-sub">Real-time writing statistics & reading time</span>
                </div>
                <div class="counter-actions">
                    <button type="button" id="copy-btn" class="mini-btn">Copy</button>
                    <button type="button" id="clear-btn" class="mini-btn muted">Clear</button>
                </div>
            </div>

            <textarea id="text" class="counter-textarea" placeholder="Paste or start typing your document here..."></textarea>

            <div class="stats-grid">
                <div class="stat-cell">
                    <strong id="words">0</strong>
                    <span>Words</span>
                </div>
                <div class="stat-cell">
                    <strong id="chars">0</strong>
                    <span>Characters</span>
                </div>
                <div class="stat-cell">
                    <strong id="sentences">0</strong>
                    <span>Sentences</span>
                </div>
                <div class="stat-cell">
                    <strong id="read-time">0 min</strong>
                    <span>Reading Time</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
