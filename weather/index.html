<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="weather-container">
        <div class="weather-card">
            <!-- Search & Quick Cities -->
            <form id="search-form" class="search-form">
                <i data-lucide="map-pin"></i>
                <input type="text" id="cityInput" placeholder="Search city..." value="Jakarta" autocomplete="off">
                <button type="submit" class="search-btn" aria-label="Search city">
                    <i data-lucide="search"></i>
                </button>
            </form>

            <div class="quick-cities">
                <button type="button" class="city-chip" data-city="Jakarta">Jakarta</button>
                <button type="button" class="city-chip" data-city="Tokyo">Tokyo</button>
                <button type="button" class="city-chip" data-city="London">London</button>
                <button type="button" class="city-chip" data-city="New York">New York</button>
            </div>

            <!-- Current Weather Main -->
            <div class="weather-main">
                <div class="weather-main-left">
                    <div id="cityName" class="city-title">Jakarta</div>
                    <div id="description" class="weather-desc">Partly Cloudy</div>
                    <div id="temperature" class="temp-display">28°C</div>
                </div>
                <div id="weatherIcon" class="weather-icon-large">
                    <i data-lucide="cloud-sun"></i>
                </div>
            </div>

            <!-- Highlights Row -->
            <div class="weather-metrics">
                <div class="metric-item">
                    <i data-lucide="wind"></i>
                    <div>
                        <span class="metric-label">Wind</span>
                        <strong id="wind-speed">12 km/h</strong>
                    </div>
                </div>
                <div class="metric-item">
                    <i data-lucide="droplets"></i>
                    <div>
                        <span class="metric-label">Humidity</span>
                        <strong id="humidity">74%</strong>
                    </div>
                </div>
                <div class="metric-item">
                    <i data-lucide="arrow-up-down"></i>
                    <div>
                        <span class="metric-label">Range</span>
                        <strong id="temp-range">24° / 32°</strong>
                    </div>
                </div>
            </div>

            <!-- 3-Day Forecast -->
            <div class="forecast-section">
                <div class="forecast-title">3-Day Forecast</div>
                <div id="forecast-list" class="forecast-list"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
