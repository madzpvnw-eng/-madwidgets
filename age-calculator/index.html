<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Age Calculator — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="age-container">
        <div class="age-card">
            <div class="age-head">
                <div>
                    <h1 class="age-title">Age Calculator</h1>
                    <span class="age-sub">Chronological & milestone statistics</span>
                </div>
            </div>

            <div class="dob-input-row">
                <input id="dob" class="dob-input" type="date" value="2002-05-15">
                <button id="calc" class="calc-btn">Calculate</button>
            </div>

            <!-- Big Result -->
            <div class="age-result-hero">
                <div class="hero-age-val" id="age">24 yrs</div>
                <div class="hero-age-detail" id="detail">5 months · 9 days</div>
            </div>

            <!-- 3 Stat Blocks -->
            <div class="age-stats-grid">
                <div class="age-stat-item">
                    <span class="label">Total Days</span>
                    <strong id="total-days">8,927</strong>
                </div>
                <div class="age-stat-item">
                    <span class="label">Total Weeks</span>
                    <strong id="total-weeks">1,275</strong>
                </div>
                <div class="age-stat-item">
                    <span class="label">Next Birthday</span>
                    <strong id="next-bday">In 204 days</strong>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
