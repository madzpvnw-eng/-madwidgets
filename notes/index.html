<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="notes-container">
        <div class="notes-card">
            <div class="notes-head">
                <div class="notes-title-wrap">
                    <i data-lucide="sticky-note"></i>
                    <h1 class="notes-title">Quick Scratchpad</h1>
                </div>
                <div class="notes-actions">
                    <button type="button" id="copy-note-btn" class="icon-btn" title="Copy text">
                        <i data-lucide="copy"></i>
                    </button>
                    <button type="button" id="clear-note-btn" class="icon-btn" title="Clear note">
                        <i data-lucide="trash-2"></i>
                    </button>
                </div>
            </div>

            <textarea id="note-input" class="notes-textarea" placeholder="Type quick thoughts, meeting notes, code snippets... Auto-saved locally."></textarea>

            <div class="notes-footer">
                <span id="save-status" class="save-status">
                    <span class="save-dot"></span>
                    <span>All changes saved</span>
                </span>
                <div class="word-stats">
                    <span id="word-count">0 words</span>
                    <span>·</span>
                    <span id="char-count">0 chars</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
