<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Date Difference — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="diff-container">
        <div class="diff-card">
            <div class="diff-head">
                <div>
                    <h1 class="diff-title">Date Difference</h1>
                    <span class="diff-sub">Calendar distance & business days</span>
                </div>
            </div>

            <div class="dates-inputs-grid">
                <div class="date-field">
                    <label for="date-start">Start Date</label>
                    <input id="date-start" class="date-input" type="date">
                </div>
                <div class="date-field">
                    <label for="date-end">End Date</label>
                    <input id="date-end" class="date-input" type="date">
                </div>
            </div>

            <!-- Big Difference Hero -->
            <div class="diff-result-hero">
                <div class="hero-diff-val" id="total-days">42 Days</div>
                <div class="hero-diff-detail" id="detail-text">6 weeks · 0 days</div>
            </div>

            <!-- Stats -->
            <div class="diff-stats-grid">
                <div class="diff-stat-item">
                    <span class="label">Business Days</span>
                    <strong id="biz-days">30 days</strong>
                </div>
                <div class="diff-stat-item">
                    <span class="label">Weekend Days</span>
                    <strong id="weekend-days">12 days</strong>
                </div>
                <div class="diff-stat-item">
                    <span class="label">Total Hours</span>
                    <strong id="total-hours">1,008 hrs</strong>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
