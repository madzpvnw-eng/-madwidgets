<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="clock-container">
        <div class="clock-card">
            <div class="clock-header">
                <span id="greeting" class="greeting-badge">
                    <span class="greeting-dot"></span>
                    <span id="greeting-text">Good day</span>
                </span>
                <div class="clock-options">
                    <button id="format-toggle" class="pill-btn" title="Toggle 12h / 24h">24H</button>
                    <button id="seconds-toggle" class="pill-btn active" title="Toggle Seconds">SEC</button>
                </div>
            </div>

            <div class="time-wrapper">
                <div id="time" class="time-display">00:00:00</div>
                <div id="ampm" class="ampm-badge" hidden>AM</div>
            </div>

            <div id="date" class="date-display">Monday, 1 January 2026</div>

            <div class="minute-progress-bar" title="Current minute progress">
                <div id="sec-progress" class="minute-progress-fill"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
