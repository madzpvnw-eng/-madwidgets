<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="stopwatch-container">
        <div class="stopwatch-card">
            <div class="stopwatch-header">
                <span class="status-indicator">
                    <span id="status-dot" class="dot"></span>
                    <span id="status-text">Ready</span>
                </span>
                <span id="lap-counter" class="lap-counter-tag">0 Laps</span>
            </div>

            <div class="display-wrapper">
                <div id="display" class="stopwatch-display">00:00:00<span class="ms-part">.00</span></div>
            </div>

            <!-- Controls -->
            <div class="controls-row">
                <button id="startPauseBtn" class="control-btn primary">
                    <i data-lucide="play" id="playIcon"></i>
                    <span id="startText">Start</span>
                </button>
                <button id="lapBtn" class="control-btn secondary" disabled>
                    <i data-lucide="flag"></i>
                    <span>Lap</span>
                </button>
                <button id="resetBtn" class="control-btn secondary" disabled>
                    <i data-lucide="rotate-ccw"></i>
                    <span>Reset</span>
                </button>
            </div>

            <!-- Lap List -->
            <div id="laps-container" class="laps-container" hidden>
                <div class="laps-header">
                    <span>Lap</span>
                    <span>Split Time</span>
                    <span>Overall</span>
                </div>
                <div id="laps-list" class="laps-list"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
