<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streak Tracker — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="streak-container">
        <div class="streak-card">
            <div class="streak-head">
                <input type="text" id="habitName" class="habit-title-input" value="Daily Deep Work" placeholder="Habit name...">
                <button type="button" id="reset-btn" class="mini-reset-btn" title="Reset streak">Reset</button>
            </div>

            <!-- Giant Streak Number -->
            <div class="flame-section">
                <div class="flame-icon-wrap">
                    <i data-lucide="flame"></i>
                </div>
                <div class="streak-digits-row">
                    <span id="streakCount" class="streak-count">14</span>
                    <span class="streak-days-label">DAYS</span>
                </div>
            </div>

            <!-- Milestone Progress -->
            <div class="milestone-box">
                <div class="milestone-head">
                    <span class="milestone-text">Next milestone: <b id="next-milestone">21 days</b></span>
                    <span id="milestone-pct" class="milestone-pct">66%</span>
                </div>
                <div class="milestone-bar">
                    <div id="progressFill" class="milestone-fill"></div>
                </div>
            </div>

            <!-- Check-In Action -->
            <button type="button" id="checkInBtn" class="checkin-btn">
                <i data-lucide="check" id="check-icon"></i>
                <span id="btn-text">Check In for Today</span>
            </button>

            <div class="streak-footer">
                <span class="last-check-text">Last check-in: <strong id="lastCheck">Today</strong></span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
