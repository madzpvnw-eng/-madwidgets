<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="habit-container">
        <div class="habit-card">
            <div class="habit-head">
                <div>
                    <h1 class="habit-title">Weekly Habits</h1>
                    <span id="overall-status" class="habit-subtitle">0 / 21 completed this week</span>
                </div>
                <div class="streak-badge">
                    <i data-lucide="flame"></i>
                    <span id="streak-num">5</span>
                </div>
            </div>

            <!-- Overall Progress Bar -->
            <div class="habit-progress-bar">
                <div id="habit-progress-fill" class="habit-progress-fill"></div>
            </div>

            <!-- Days Header (M T W T F S S) -->
            <div class="days-header-row">
                <span class="habit-name-col">Habit</span>
                <div class="days-cols" id="days-labels">
                    <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                </div>
            </div>

            <!-- Habit Rows -->
            <div id="habits-list" class="habits-list"></div>

            <!-- Add / Reset controls -->
            <div class="habit-actions">
                <button type="button" id="add-habit-btn" class="action-link">+ Add habit</button>
                <button type="button" id="reset-week-btn" class="action-link muted">Reset week</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
