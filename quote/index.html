<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quote — Notion Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-toolbar">
        <div class="widget-toolbar-left">
            <a href="../index.html" class="toolbar-btn">← MadWidgets</a>
        </div>
        <div class="widget-toolbar-right">
            <button class="toolbar-btn copy-embed-btn" onclick="copyNotionEmbedUrl()">
                <i data-lucide="share-2"></i>
                <span class="label-text">Copy Embed</span>
            </button>
            <button id="theme-toggle" class="toolbar-btn theme-toggle" aria-label="Switch theme">☾</button>
        </div>
    </div>

    <main class="quote-container">
        <div class="quote-card">
            <div class="quote-header">
                <div class="quote-tag">
                    <i data-lucide="quote"></i>
                    <span id="quote-category">INSPIRATION</span>
                </div>
                <div class="quote-controls">
                    <button id="copy-quote-btn" class="icon-btn" title="Copy quote text" aria-label="Copy quote">
                        <i data-lucide="copy"></i>
                    </button>
                    <button id="new-quote" class="icon-btn" title="Get new quote" aria-label="New quote">
                        <i data-lucide="shuffle"></i>
                    </button>
                </div>
            </div>

            <div class="quote-content" id="quote-box">
                <p id="quote" class="quote-text">“Success is the sum of small efforts repeated day after day.”</p>
                <div class="quote-footer">
                    <span id="author" class="quote-author">— Robert Collier</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
